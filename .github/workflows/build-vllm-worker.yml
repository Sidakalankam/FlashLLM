name: Build vLLM worker

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "vllm-worker/**"
      - ".github/workflows/build-vllm-worker.yml"

# Prevent overlapping releases from calculating
# the same version number.
concurrency:
  group: vllm-worker-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute next vLLM worker version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          latest_tag="$(
            git tag -l 'vllm-worker-v[0-9]*' \
              --sort=-v:refname | head -n 1
          )"

          if [[ -z "$latest_tag" ]]; then
            next_number=1
          else
            latest_number="${latest_tag#vllm-worker-v}"
            next_number=$((latest_number + 1))
          fi

          image_tag="v${next_number}"
          git_tag="vllm-worker-${image_tag}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"

          echo "Building FlashLLM worker version: ${image_tag}"

      - name: Build and push vLLM worker
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./vllm-worker
          file: ./vllm-worker/Dockerfile
          platforms: linux/amd64
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-vllm-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-vllm-worker:${{ steps.version.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-vllm-worker:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=FlashLLM vLLM Worker
            org.opencontainers.image.description=GPU inference worker for FlashLLM
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}

      - name: Save vLLM worker version tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            "${{ steps.version.outputs.git_tag }}" \
            "${{ github.sha }}"

          git push origin \
            "${{ steps.version.outputs.git_tag }}"

      - name: Print published image details
        shell: bash
        run: |
          echo "========================================"
          echo "FlashLLM vLLM Worker Published"
          echo "========================================"
          echo ""
          echo "Version: ${{ steps.version.outputs.image_tag }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "Image digest: ${{ steps.docker_build.outputs.digest }}"
          echo ""
          echo "Docker image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-vllm-worker:${{ steps.version.outputs.image_tag }}"
